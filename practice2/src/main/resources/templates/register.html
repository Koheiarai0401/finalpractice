<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ユーザ新規登録画面</title>
</head>
<body>
	<h1>ユーザ新規登録画面</h1>
	<form action="register" th:object="${registerForm}" method="post">
		<table border="1">
			<tr>
				<td>店舗</td>
				<td>
					<input type="text" th:field="*{storeName}">
					<span th:if="${#fields.hasErrors('storeName')}" th:errors="*{storeName}" style="color: red"></span>
				</td>
			</tr>
			<tr>
				<td>姓</td>
				<td>
					<input type="text" th:field="*{lastName}">
					<span th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}" style="color: red"></span>
				</td>
			</tr>
			<tr>
				<td>名</td>
				<td>
					<input type="text" th:field="*{firstName}">
					<span th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}" style="color: red"></span>
				</td>
			</tr>
			<tr>
				<td>email</td>
				<td>
					<input type="email" th:field="*{email}">
					<span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" style="color: red"></span>
				</td>
			</tr>
			<tr>
				<td>電話番号</td>
				<td>
					<input type="tel" th:field="*{phone}">
					<span th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}" style="color: red"></span>
				</td>
			</tr>
			<tr>
				<td>パスワード</td>
				<td>
					<input type="password" th:field="*{password}">
					<span th:if="${#fields.hasErrors('password')}" th:errors="*{password}" style="color: red"></span>
				</td>
			</tr>
		</table>
		<input type="submit" value="送信">
		<input type="submit" value="戻る">
	</form>
</body>
</html>
